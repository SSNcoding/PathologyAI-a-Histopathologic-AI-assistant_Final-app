name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile check
        run: python -m py_compile $(find . -name "*.py" -not -path "./.venv/*")
      # Best-effort — Streamlit apps can print ScriptRunContext warnings when
      # imported outside `streamlit run`, so this stays non-blocking. The
      # pytest step below is the real, un-masked CI gate.
      - name: Import smoke test (best-effort)
        run: python -c "import app_create" || true
      - name: Run test suite
        run: pytest -v
