[theme]
base = "dark"
primaryColor = "#06B6D4"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor = "#F1F5F9"
font = "sans serif"

[server]
# headless=false so `streamlit run app_create.py` opens your default browser
# straight to the app automatically on a local machine. Deployment hosts
# (Render/Railway/Fly.io/Streamlit Cloud) set STREAMLIT_SERVER_HEADLESS=true
# as an environment variable themselves, which overrides this file, so this
# doesn't affect production deploys.
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false